[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gee-mpc-sentinel2-validation"
version = "1.1.0"
description = "Check whether Sentinel-2 L2A from Google Earth Engine and Microsoft Planetary Computer can be combined: catalogue reconciliation, L2A generation audit and scene-universe effect on composites."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Heiber Alexander Pantevez Villamil", email = "hapantevezv@unal.edu.co"}]
keywords = ["Sentinel-2", "Google Earth Engine", "Microsoft Planetary Computer", "STAC", "reproducibility", "remote sensing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "earthengine-api>=1.7",
    "pystac-client>=0.9",
    "planetary-computer>=1.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gee-mpc-reconcile = "gee_mpc_s2val.cli:reconcile"
gee-mpc-e2 = "gee_mpc_s2val.cli:e2"
gee-mpc-impact = "gee_mpc_s2val.cli:impact"
gee-mpc-verify-demo = "gee_mpc_s2val.cli:verify_demo"

[project.urls]
"Zenodo record (v1.0.0)" = "https://doi.org/10.5281/zenodo.23241823"
Repository = "https://github.com/hapantevezv-collab/gee-mpc-sentinel2-validation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ee: needs Earth Engine credentials and network (set GEE_PROJECT to run)",
]
